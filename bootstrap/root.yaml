# Root Application (app-of-apps). Watches this repo's apps/ tree and creates one
# Argo CD Application per service found. After Argo CD is installed, applying this
# single manifest brings the whole platform state back from git — no per-service
# manual apply needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/atlas-platform-tcc/atlas-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      include: '{**/application.yaml}'   # only Application manifests, not values files
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
