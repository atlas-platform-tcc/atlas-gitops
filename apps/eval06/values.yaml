# Desired state for eval06 — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/eval06
  tag: "383ca13f301ecc5ce2dac613652fac5206c15273"
ingress:
  enabled: true
  host: eval06.127.0.0.1.nip.io
database:
  enabled: true
env:
  - name: DB_TYPE
    value: "postgres"
