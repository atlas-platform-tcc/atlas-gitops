# Desired state for eval04 — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/eval04
  tag: "a50a4a9c54b1082c5b7ab742c8527c5070eaac01"
ingress:
  enabled: true
  host: eval04.127.0.0.1.nip.io
database:
  enabled: true
env:
  - name: DB_TYPE
    value: "postgres"
