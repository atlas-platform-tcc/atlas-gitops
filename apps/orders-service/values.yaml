# Desired state for orders-service — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/orders-service
  tag: "78463e72bb92c3f9fd8b106ec5dc439e5698c63c"
ingress:
  enabled: true
  host: orders-service.127.0.0.1.nip.io
database:
  enabled: true
env:
  - name: DB_TYPE
    value: "postgres"
