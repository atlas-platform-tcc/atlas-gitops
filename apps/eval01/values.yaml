# Desired state for eval01 — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/eval01
  tag: "16618a8ebf61a6b586f5379f6da386c2e5b7b815"
ingress:
  enabled: true
  host: eval01.127.0.0.1.nip.io
database:
  enabled: true
env:
  - name: DB_TYPE
    value: "postgres"
