# Desired state for payments-service — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/payments-service
  tag: "239415d478534384a6f82b5fb8462a34670e185c"
ingress:
  enabled: true
  host: payments-service.127.0.0.1.nip.io
database:
  enabled: true
env:
  - name: DB_TYPE
    value: "postgres"
