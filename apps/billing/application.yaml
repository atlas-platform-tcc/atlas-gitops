# Generated by Atlas. Argo CD Application for service billing.
# Provisioning skeleton: combines the shared base chart (atlas-templates) with the
# per-service values below (atlas-gitops, via the $values multi-source reference).
# No image is pinned and replicaCount is 0, so nothing is deployed until the first
# day-2 Deploy pins a digest and scales the service up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: atlas
spec:
  project: default
  sources:
    - repoURL: https://github.com/atlas-platform-tcc/atlas-templates.git
      targetRevision: main
      path: charts/base
      helm:
        valueFiles:
          - $values/apps/billing/values.yaml
    - repoURL: https://github.com/atlas-platform-tcc/atlas-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: billing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
