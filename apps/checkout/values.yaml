# Desired state for checkout — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/checkout
  tag: "638e9f066935aa4d06d8531f7f5b0d3f7a308e56"
env:
  - name: DB_TYPE
    value: "postgres"
