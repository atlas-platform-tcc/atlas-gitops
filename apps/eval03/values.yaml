# Desired state for eval03 — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/eval03
  tag: "fa93e21128c2bd8c60b84d81e61661b523edaec1"
ingress:
  enabled: true
  host: eval03.127.0.0.1.nip.io
database:
  enabled: true
env:
  - name: DB_TYPE
    value: "postgres"
