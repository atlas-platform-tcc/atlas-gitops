# Desired state for eval02 — consumed by its Argo CD Application ($values).
# Base deploy: pins the image built from the service's initial commit and runs the
# requested replicas. Day-2 Deploys update image.tag to a newer commit SHA.
replicaCount: 2
image:
  repository: ghcr.io/atlas-platform-tcc/eval02
  tag: "457d6031b95763b202ae41e094e4fa372e0c88d2"
ingress:
  enabled: true
  host: eval02.127.0.0.1.nip.io
database:
  enabled: true
env:
  - name: DB_TYPE
    value: "postgres"
